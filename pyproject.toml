[project]
name = "doom-marl-cl"
version = "0.1.0"
description = "Cross-egocentric contrastive learning (CECL) for decentralized multi-agent RL in ViZDoom"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "benchmarl>=1.5.2",
    "matplotlib>=3.10.8",
    "moviepy>=2.2.1",
    "opencv-python-headless>=4.13.0.92",
    "pettingzoo>=1.25.0",
    "rich>=15.0.0",
    "tensordict>=0.11.0",
    "torch==2.11.0",
    "torchinfo>=1.8.0",
    "torchrl>=0.11.1",
    "torchvision==0.26.0",
    "transformers>=4.56.0",
    "vizdoom==1.3.1.dev1",
    "wandb>=0.25.1",
]

[tool.uv.sources]
vizdoom = { path = "wheels/vizdoom-1.3.1.dev1-cp311-cp311-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl" }
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
